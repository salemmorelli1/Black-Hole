name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci-lock.txt

      - name: Install package
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src scripts run_research_pipeline.py

      - name: Unit tests
        run: python -m pytest

      - name: Compile
        run: python -m compileall src tests scripts run_research_pipeline.py

      - name: CLI smoke test
        run: |
          bhid validate --config configs/baseline.json
          bhid run --config configs/baseline.json --replicates 4 --seed 17 --output /tmp/bhid-summary.json

      - name: Repository validation entry point
        run: python scripts/part4_validate_repository.py --output /tmp/bhid-validation.json

      - name: Build package
        run: python -m build
