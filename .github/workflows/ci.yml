name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci-lock.txt

      - name: Install package
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Verify delivered source
        run: python verify_source.py

      - name: Type check
        run: python -m mypy src scripts run_research_pipeline.py verify_source.py

      - name: Unit tests
        run: python -m pytest

      - name: Compile
        run: python -m compileall src tests scripts run_research_pipeline.py

      - name: CLI smoke test
        run: |
          bhid validate --config configs/baseline.json
          bhid run --config configs/baseline.json --replicates 4 --seed 17 --output artifacts/ci/summary.json

      - name: Repository validation entry point
        run: python scripts/part4_validate_repository.py --output artifacts/ci/validation.json

      - name: Complete captured-input pipeline
        run: python run_research_pipeline.py --replicates 4 --seed 17 --output-root artifacts/ci/pipeline

      - name: Build package
        run: python -m build

  browser:
    name: Site verification (Microsoft Edge)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-browser-lock.txt
      - run: python -m unittest discover -s tests -p test_site.py -v
        env:
          BHID_BROWSER_TESTS: "1"
          BHID_TEST_BROWSER: msedge
          BHID_SCREENSHOT: artifacts/browser/site.png

      - name: Preserve browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-edge-evidence
          path: artifacts/browser/site.png
          if-no-files-found: error
